[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onepact"
version = "1.0.0"
description = "A local-first CLI for tasks, journaling, and daily review."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Prajwal Srinivas" }]
dependencies = []

[project.scripts]
onepact = "onepact.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["src/onepact"]

[tool.coverage.report]
show_missing = true
